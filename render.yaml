services:
  - type: web
    name: ai-data-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_FAST
        value: gpt-4.1-mini
      - key: MODEL_SQL
        value: gpt-4.1-mini
      - key: MODEL_ETL
        value: gpt-4.1-mini
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: REQUESTS_PER_HOUR
        value: "20"

  - type: web
    name: ai-data-agent-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOURCE_URL
        sync: false
