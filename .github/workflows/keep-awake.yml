name: Keep Render App Awake

on:
  schedule:
    # Runs every 13 minutes, between 07:00 and 22:59 UTC
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -I "https://data-agent-tzbs.onrender.com/api/health"
